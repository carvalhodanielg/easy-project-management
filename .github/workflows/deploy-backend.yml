name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test

  deploy:
    name: Trigger Coolify deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Coolify builds and deploys the Application resource itself (it pulls
      # the repo, builds backend/Dockerfile with target `production`, runs
      # the /health check, and swaps traffic) — this just tells it to start.
      # COOLIFY_WEBHOOK_URL comes from the Application's Webhooks tab in the
      # Coolify panel; COOLIFY_API_TOKEN from Keys & Tokens.
      - name: Trigger deploy
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
