services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # env_file (not `environment:` + ${VAR} substitution) so the root
    # credentials come straight from .env.prod without relying on compose
    # also auto-loading a top-level `.env` file.
    env_file: .env.prod
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` published — only reachable from other containers on the
    # compose network. The world talks to the app through the backend/Nginx.

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # Bind to loopback only; Nginx on the host proxies HTTPS to this port.
      - "127.0.0.1:3000:3000"

volumes:
  mongo_data:
