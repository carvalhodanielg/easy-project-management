services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: atkplan
      MONGO_INITDB_ROOT_PASSWORD: atkplan_secret
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://atkplan:atkplan_secret@mongo:27017/atkplan?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-changeme-in-development}
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      UPLOAD_DEST: /app/uploads
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  mongo_data:
  uploads_data:
  backend_modules:
  frontend_modules:
